  const x=e.clientX,y=e.clientY,l=pick(links,x,y,8,6),hd=l?null:pick(hits,x,y,18,12),hn=hd?hd.node:null,hl=l?l.key:null,hb=overBack(x,y);
  if(hn!==hoverNode||hl!==hoverLink||hb!==hoverBack){hoverNode=hn;hoverLink=hl;hoverBack=hb;need=true}cv.style.cursor=hn||hb?'pointer':'default';
  if(e.pointerType==='mouse'&&!reduce){par.tx=-(x/vw-.5)*14;par.ty=-(y/vh-.5)*14*.6}});
document.addEventListener('pointerleave',()=>{hoverNode=null;hoverLink=null;hoverBack=false;need=true});
cv.addEventListener('click',e=>{if(dragged){dragged=false;return}const x=e.clientX,y=e.clientY;if(overBack(x,y))return back();const hd=pick(hits,x,y,18,12);if(!hd)return back();hd.node.open?closeNode(hd.node):openNode(hd.node)});
linkBox.addEventListener('click',e=>{if(dragged){e.preventDefault();dragged=false}});
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace')back()});

/* ------------------------------------------------------------------ boot */
function resize(){vw=innerWidth;vh=innerHeight;dpr=Math.max(1,Math.min(2,devicePixelRatio||1));narrow=vw<700;fs=narrow?14:15;frameW=narrow?9:16;inset=frameW+4;P=params();
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);cv.style.width=vw+'px';cv.style.height=vh+'px';
  if(!printer)printer=makePrinter();mask=document.createElement('canvas');mask.width=cv.width;mask.height=cv.height;mx=mask.getContext('2d');
  tiles.clear();docCache.clear();linkSig='~';
  buildRoot();const path=[];let n=root;for(;;){const k=n.kids.find(c=>c.isDir&&c.open);if(!k)break;path.push(k);n=k}
  for(const k of path)buildChild(k);active=deepest(root);frameCam(active,true);need=true}
addEventListener('resize',resize);
window.__tree={root,get active(){return active},open(path){let n=root;for(const name of path){n=n.kids.find(k=>k.name===name);if(!n)throw new Error('no such node: '+name);openNode(n)}},back,
  settle(){const s=n=>{n.u=n.open?1:0;n.g=n.u;for(const k of n.kids){if(k.isDir)s(k);if(k.doc)k.typed=n.open?1:0;else{k.foldU=foldT(k);k.fold=k.foldU}}};s(root);cam.x=cam.tx;cam.y=cam.ty;need=true},
  scroll(d){scrollBy(d);cam.y=cam.ty},
  overlaps(){const all=[...hits,...links.filter(l=>l.key[0]==='n')],out=[];for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)if(hit(all[i],all[j],0))out.push((all[i].node?all[i].node.name:all[i].label)+' / '+(all[j].node?all[j].node.name:all[j].label));return out},
  cut(){return[...hits,...links.filter(l=>l.key[0]==='n')].filter(g=>g.x<inset||g.x+g.w>vw-inset||g.y<inset||g.y+g.h>vh-inset).map(g=>g.node?g.node.name:g.label)},
  get info(){return{gl:printer&&printer.gl,hits:hits.map(h=>({name:h.node.name,x:h.x,y:h.y,w:h.w,h:h.h})),links:links.length,cam:{...cam},vw,vh}}};
const start=()=>{resize();requestAnimationFrame(t=>{last=t;tick(t)})};
let started=false;const go=()=>{if(!started){started=true;start()}};
try{document.fonts.load('500 15px "Libre Franklin"').then(()=>document.fonts.load('700 15px "Libre Franklin"')).then(go,go)}catch(e){go()}
setTimeout(go,1800);
})();
</script>
